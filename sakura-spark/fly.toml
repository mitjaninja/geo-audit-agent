# Fly.io: одна машина с томом под SQLite. Имя приложения должно быть уникальным во всём Fly —
# если «sakura-spark» занято, поменяйте app (адрес станет https://<app>.fly.dev автоматически).
app = "sakura-spark"
primary_region = "ams"

[env]
  PORT = "8787"
  DB_PATH = "/data/sakura.db"

[[mounts]]
  source = "sakura_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  # SQLite живёт на одной машине: не гасим её и не масштабируем горизонтально
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
